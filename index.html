<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MiniOS</title>
<style>
:root{--win:#fbfaf7;--tx:#1d2320;--mut:#66706b;--bar:#e9ece6;--bd:#d3d9d1;--ac:#1f7a5c;--acx:#fff;--task:#14201bcc;--in:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--wp:linear-gradient(135deg,#0f3d3e,#2a6f5a 55%,#d9a441)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--win:#1a201d;--tx:#e6ece7;--mut:#93a09a;--bar:#252d29;--bd:#34403a;--in:#121815}}
:root[data-theme="dark"]{--win:#1a201d;--tx:#e6ece7;--mut:#93a09a;--bar:#252d29;--bd:#34403a;--in:#121815}
html{height:100%}
body{margin:0;height:100%;background:#0f3d3e;font:14px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;color:var(--tx);overflow:hidden}
#desk{position:relative;height:100%;background:var(--wp);overflow:hidden}
#icons{display:grid;grid-template-columns:repeat(auto-fill,84px);gap:6px;padding:14px;position:absolute;inset:0 0 48px 0;align-content:start}
.ic{background:none;border:0;color:#fff;text-align:center;padding:8px 2px;border-radius:10px;cursor:pointer;font:inherit;text-shadow:0 1px 3px #0007}
.ic:hover,.ic:focus-visible{background:#ffffff26;outline:none}.ic b{display:block;font-size:30px;font-weight:400}
.win{position:absolute;display:flex;flex-direction:column;background:var(--win);border:1px solid var(--bd);border-radius:10px;box-shadow:0 14px 40px #0006;overflow:hidden;min-width:260px;min-height:160px}
.win[hidden]{display:none}.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - 48px)!important;border-radius:0}
.tb{display:flex;align-items:center;justify-content:space-between;background:var(--bar);padding:6px 8px 6px 12px;cursor:move;user-select:none;touch-action:none;font-weight:600}
.tb i{display:flex;gap:4px}.tb button{width:26px;height:26px;border:0;border-radius:6px;background:none;color:var(--tx);cursor:pointer;font-size:13px}.tb button:hover{background:var(--bd)}.tb button[data-a=x]:hover{background:#c8443a;color:#fff}
.bd{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px;gap:8px;overflow:auto}
input,select,textarea,button.b{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:6px;padding:6px 9px}
button.b{background:var(--ac);color:var(--acx);border-color:var(--ac);cursor:pointer}button.b.g{background:none;color:var(--tx);border-color:var(--bd)}
textarea{flex:1;resize:none;font:13px/1.5 ui-monospace,Consolas,monospace;min-height:120px}
input{min-width:0}.row{display:flex;gap:6px;align-items:center}.row input{flex:1}
.it{padding:5px 6px;border-radius:6px}.it:hover{background:var(--bar)}.it span{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis}
iframe{flex:1;border:1px solid var(--bd);border-radius:6px;background:#fff;min-height:120px}
.term{background:#0d1210;color:#b8f2cf;font:13px ui-monospace,Consolas,monospace}.term pre{flex:1;margin:0;overflow:auto;white-space:pre-wrap}.term input{background:#0d1210;color:#b8f2cf;border-color:#2a3a32}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.calc input{grid-column:1/-1;text-align:right;font-size:22px}.calc button{padding:12px 0;font-size:16px}
.sw{width:44px;height:30px;border-radius:6px;border:2px solid var(--bd);cursor:pointer}
#bar{position:absolute;left:0;right:0;bottom:0;height:48px;background:var(--task);backdrop-filter:blur(10px);display:flex;align-items:center;gap:6px;padding:0 10px;color:#fff;z-index:99999}
#tasks{flex:1;display:flex;gap:6px;overflow-x:auto}#tasks button{background:#ffffff1f;border:0;color:#fff;border-radius:6px;padding:6px 10px;font:inherit;white-space:nowrap;cursor:pointer}#tasks button.on{background:#ffffff4d}
@media (max-width:700px){.win{left:0!important;top:0!important;width:100%!important;height:calc(100% - 48px)!important;border-radius:0}}
</style></head><body>
<div id="desk"><div id="icons"></div><div id="bar"><b>☁ MiniOS</b><div id="tasks"></div><span id="cl" style="opacity:.7;font-size:12px">local only</span><span id="clock"></span></div></div>
<script>
const $=(s,e=document)=>e.querySelector(s);
